name: Build releases
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft only after direct release authorization'
        type: boolean
        default: false
      release_tag:
        description: 'Existing version tag matching the built commit'
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install -r requirements.txt -r .github/requirements-build.txt
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os, ck3loc; assert os.environ['GITHUB_REF_NAME'] == 'v' + ck3loc.__version__"
      - run: python .github/build_release.py
        id: package
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/create_draft.py
